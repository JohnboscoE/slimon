name: Agent loop

# Keeps the agent running unattended on GitHub's runners.
#
# One tick per five minutes cannot come from the schedule itself: GitHub throttles frequent crons
# hard (a */5 schedule delivered 2 runs in a day, several hours late). So each run instead holds
# the agent's own loop open for ~5 hours, ticking on every closed candle and committing the log
# hourly, and then hands over to the next run. That needs ~5 runs a day, which the scheduler
# manages, and ticks land 15s after each candle close as they do locally.
#
# Handover, in order of reliability:
#   1. LOOP_PAT secret (fine-grained PAT, Actions: read and write) - this run dispatches the next.
#      The built-in GITHUB_TOKEN cannot: dispatches made with it never start a workflow run.
#   2. The cron below. The concurrency group keeps one run going and at most one waiting, so a
#      queued run starts the moment the current one ends.
#
# Requires secrets: BITGET_API_KEY, BITGET_API_SECRET, BITGET_API_PASSPHRASE, QWEN_API_KEY.
# Set the repository variable ENABLE_TRADING to 1 to place demo orders (otherwise dry_run).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: slimon-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tick for five hours
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_TRADING: ${{ vars.ENABLE_TRADING }}
          # The agent commits and pushes the log itself, hourly (see [publish] in config).
          AUTO_COMMIT_LOG: "1"
          AUTO_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          started=$(date +%s)
          timeout --preserve-status 18000 python -m slimon run || echo "loop exited with $?"
          echo "ran for $(( ($(date +%s) - started) / 60 )) minutes"
          # A loop that dies immediately would otherwise spin up runs back to back.
          if [ $(( $(date +%s) - started )) -lt 120 ]; then sleep 120; fi

      - name: Commit the last ticks
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refresh the flat trade record judges read (reports/paper_trades.csv) from the log.
          python -m slimon report > /dev/null || echo "report generation failed; log still committed"
          git add logs reports
          # Runtime state is untracked locally; on a wiped runner the risk counters (drawdown
          # baseline, cooldowns, per-symbol spacing) have to travel with the repository.
          git add -f state/state.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "log: ticks through $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing onto origin (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "could not push the log after 3 attempts" >&2
          exit 1

      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.LOOP_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No LOOP_PAT secret: relying on the cron backstop to start the next run."
            exit 0
          fi
          gh workflow run agent-loop.yml --ref "${GITHUB_REF_NAME}"
          echo "next run dispatched"
