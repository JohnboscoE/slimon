# Agent configuration. Committed on purpose: the risk limits are part of the
# submission and every decision-log record references the config hash it ran under.

[agent]
tick_seconds = 300                 # one tick per closed 5m candle
category = "USDT-FUTURES"

# Perception watches the whole US-stock perp universe on Bitget...
watchlist = [
  "NVDAUSDT", "TSLAUSDT", "AAPLUSDT", "METAUSDT", "AMZNUSDT", "GOOGLUSDT",
  "COINUSDT", "HOODUSDT", "MSTRUSDT", "CRCLUSDT", "SP500USDT", "NDX100USDT",
]
# ...but the agent may only trade this narrower whitelist (enforced by the risk gate).
whitelist = [
  "NVDAUSDT", "TSLAUSDT", "AAPLUSDT", "METAUSDT", "AMZNUSDT", "GOOGLUSDT",
  "SP500USDT", "NDX100USDT",
]

[llm]
# Which model makes the decisions. Both get the same system prompt, the same JSON schema and the
# same validation; only the transport differs.
provider = "qwen"                  # "qwen" (QWEN_API_KEY) or "anthropic" (ANTHROPIC_API_KEY)
# Ceilings per UTC day, so a fixed credit lasts a known number of days. A busy session produces
# ~25-30 calls; past the cap, ticks are still logged with the model left unconsulted.
max_calls_per_day = 40
max_cost_usd_per_day = 0.05        # only bites where the provider reports cost (Anthropic)

[llm.qwen]
# Bitget AI hackathon gateway (Qwen token subsidy), OpenAI-compatible chat completions.
model = "qwen3.8-max"
base_url = "https://hackathon.bitgetops.com/v1"
# Unbounded, qwen3.8-max reasoned ~4,500 tokens per decision and took ~4 minutes: too slow for a
# 5-minute tick, and the gate would judge the order against stale prices. A 1,000-token budget
# measured ~30s with the same decision quality. 0 turns thinking off (~10s).
thinking_budget = 1000
timeout_seconds = 120              # a slower call is abandoned and logged, never retried

[llm.anthropic]
model = "claude-sonnet-5"
effort = "medium"                  # adaptive-thinking depth
# USD per million tokens, used to log each call's cost from its token usage.
price_input_per_mtok = 2.0
price_output_per_mtok = 10.0

[perception]
candle_interval = "5m"
lookback_candles = 48              # 4h of 5m candles for ATR / volume baselines
move_window_candles = 6            # 30 min
move_threshold_pct = 1.0           # |30m return| that counts as a price event
range_atr_multiple = 3.0           # single-candle range vs ATR
volume_multiple = 4.0              # single-candle volume vs median
event_cooldown_minutes = 60        # same (type, symbol) cannot re-fire inside this window
position_review_hours = 4          # periodic LLM review of held positions
position_pnl_band_pct = 1.5        # re-review when unrealized PnL crosses another band

# Scheduled macro events: diary entries, not a news feed. Each fires once, when the first tick at
# or after `at` runs, and sends held positions back to the model with the catalyst named. The agent
# cannot see an unscheduled headline or speech; it sees the price move that follows one.
# Example:
#   macro_events = [
#     { at = "2026-09-29T18:00:00Z", name = "FOMC rate decision", note = "statement, then press conference" },
#   ]
macro_events = []

[risk]
min_confidence = 0.55
max_order_notional_usdt = 1500
max_position_pct_equity = 15
max_gross_exposure_pct_equity = 40
max_open_positions = 3
leverage = 2
daily_drawdown_halt_pct = 3.0      # vs equity at first tick of the UTC day
consecutive_loss_limit = 3
loss_cooldown_minutes = 240
max_trades_per_day = 8
symbol_min_minutes_between_trades = 60
max_spread_pct = 0.30              # demo book spread sanity bound
max_live_demo_divergence_pct = 1.5 # demo vs live venue price sanity bound
stop_loss_pct = 2.5                # hard stop, enforced locally AND preset on the exchange
take_profit_pct = 5.0              # target, likewise: twice the stop, so a winner pays for two losers
max_holding_hours = 72
open_sessions = ["pre", "regular", "post"]   # no new positions overnight / weekends

[news]
# Public headlines as events. Free RSS feeds, no API key. A headline on a held position always
# sends that position back to the model; one on a tradable name or a market-moving topic can
# trigger a decision. Each event says whether the market has confirmed it this tick.
enabled = true
max_age_minutes = 30               # only headlines published in the last half hour are new
max_events_per_tick = 5            # held positions first, then tradable names, then the market
max_per_symbol = 2                 # so one busy name cannot crowd out the rest

# Google News search per traded company; a headline must name the company or its ticker.
# The index perps (SP500USDT, NDX100USDT) have no search of their own: a search for "S&P 500"
# returns mostly single-stock stories that merely mention the index. Index-level news arrives
# through the market-wide feeds below.
[news.symbol_queries]
NVDAUSDT = "Nvidia"
TSLAUSDT = "Tesla"
AAPLUSDT = "Apple"
METAUSDT = "Meta Platforms OR Meta"
AMZNUSDT = "Amazon"
GOOGLUSDT = "Alphabet OR Google"

# Market-wide feeds. The Fed's own releases carry rate decisions and policy statements; general
# market headlines must mention a market-moving topic to count.
[[news.macro_feeds]]
name = "federal_reserve"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
keywords = ["FOMC", "federal funds", "monetary policy", "interest rate", "rates", "statement", "Powell", "minutes", "balance sheet"]

[[news.macro_feeds]]
name = "cnbc_markets"
url = "https://www.cnbc.com/id/20910258/device/rss/rss.html"
keywords = ["Fed", "Powell", "rate cut", "rate hike", "rates", "inflation", "CPI", "PCE", "jobs report", "payrolls", "unemployment", "GDP", "recession", "tariff", "tariffs", "Trump", "White House", "sanctions", "war", "strike", "Treasury", "yields", "sell-off", "selloff", "rally", "crash"]

[sim]
# Used only when no Bitget key is configured (local paper book, demo-venue prices).
starting_equity_usdt = 10000
taker_fee_rate = 0.0006

[publish]
commit_every_minutes = 60
